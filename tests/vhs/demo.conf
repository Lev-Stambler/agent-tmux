# Minimal self-contained config for the VHS scenarios: a theme plus this plugin,
# and nothing else. Deliberately NOT the author's personal tmux.conf — these
# tests must prove the SHIPPED plugin renders, not a local setup.
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
set -g pane-base-index 1

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @plugin 'catppuccin/tmux#v2.1.3'
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# the plugin under test — path injected by run.sh via AGENT_TMUX_DIR
run '#{@agent_tmux_selfdir}/agent-tmux.tmux'
